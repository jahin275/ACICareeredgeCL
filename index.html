<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a3d62">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ACI Careeredge Campus Lead</title>
<link rel="icon" href="./favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="preload" as="image" href="./LOGO.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1bddff;--ground:#2e7d32;--card:rgba(255,255,255,.94);--orange:#ff8c00;--text:#1a1a1a;--dark:#0d2b3e;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;}
  body{user-select:none;-webkit-user-select:none;}
  input,textarea,select{user-select:text;-webkit-user-select:text;}
  img{-webkit-user-drag:none;pointer-events:none;}

  #sky{position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(circle at 20% 20%, #fff6 0 4px, transparent 5px),
      radial-gradient(circle at 70% 40%, #fff6 0 6px, transparent 7px),
      radial-gradient(circle at 85% 15%, #fff5 0 5px, transparent 6px),
      linear-gradient(180deg, #1bddff 0%, #45e3ff 60%, #a8f0ff 100%);
    background-size:200px 200px,300px 300px,250px 250px,100% 100%;
    will-change:transform;}
  #clouds{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      radial-gradient(ellipse 80px 30px at 15% 15%, #fff, transparent 70%),
      radial-gradient(ellipse 100px 35px at 60% 25%, #fff, transparent 70%);
    opacity:.5;will-change:transform;}
  #ground{position:fixed;bottom:0;left:0;width:100%;height:100px;z-index:-1;pointer-events:none;background:var(--ground);
    box-shadow:inset 0 6px 0 #1b5e20;
    background-image:repeating-linear-gradient(90deg,#2e7d32 0 40px,#276b2b 40px 80px);}

  header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
    background:rgba(0,0,0,.4);backdrop-filter:blur(6px);border-bottom:4px solid #000;
    position:sticky;top:0;z-index:50;
    padding-top:max(10px, env(safe-area-inset-top));}
  .brand-wrap{display:flex;align-items:center;gap:10px;min-width:0;}
  .logo{height:40px;image-rendering:pixelated;flex-shrink:0;}
  .brand-title{font-family:'Press Start 2P',monospace;font-size:.75em;color:#fff;
    text-shadow:2px 2px 0 #000,3px 3px 0 #ff8c00;letter-spacing:1px;line-height:1.3;
    -webkit-font-smoothing:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-info{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:.8em;min-width:0;}
  .user-info span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;}

  .container{max-width:820px;margin:0 auto;padding:14px;
    padding-bottom:max(20px, env(safe-area-inset-bottom));}
  .card{background:var(--card);border:4px solid #000;border-radius:12px;padding:16px;margin-bottom:14px;
    box-shadow:5px 5px 0 rgba(0,0,0,.35);}
  .card h2,.card h3{margin-bottom:10px;font-size:1.05em;}
  input,textarea{width:100%;padding:14px 14px;margin-bottom:10px;border:3px solid #000;border-radius:8px;
    background:#fff;font-size:16px;touch-action:manipulation;}
  label{font-weight:600;display:block;margin-bottom:4px;font-size:.88em;}
  .btn{padding:14px 20px;min-height:48px;border:3px solid #000;border-radius:8px;cursor:pointer;
    font-weight:800;font-size:1em;background:#fff;color:#000;box-shadow:3px 3px 0 #000;
    transition:transform .06s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;}
  .btn:disabled{opacity:.6;cursor:wait;}
  .btn-primary{background:var(--ground);color:#fff;}
  .btn-warn{background:var(--orange);color:#fff;}
  .btn-secondary{background:#b0bec5;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}

  .stats-card{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
    background:var(--card);border:4px solid #000;border-radius:12px;padding:12px;margin-bottom:14px;
    box-shadow:5px 5px 0 rgba(0,0,0,.35);}
  .stat-box{text-align:center;padding:10px 4px;border:3px solid #000;border-radius:8px;
    background:#e0f7fa;box-shadow:2px 2px 0 #000;}
  .stat-box.total{background:linear-gradient(135deg,#ffb347,#ff8c00);color:#fff;text-shadow:1px 1px 0 #000;}
  .stat-box.team{background:linear-gradient(135deg,#5c6bc0,#3949ab);color:#fff;text-shadow:1px 1px 0 #000;}
  .stat-label{font-family:'Press Start 2P',monospace;font-size:.5em;margin-bottom:6px;display:block;color:#333;}
  .stat-box.total .stat-label,.stat-box.team .stat-label{color:#fff;}
  .stat-value{font-family:'Press Start 2P',monospace;font-size:1em;font-weight:900;color:#0d2b3e;}
  .stat-box.total .stat-value,.stat-box.team .stat-value{color:#fff;}

  .month-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .month-tab{padding:8px 14px;min-height:40px;border:3px solid #000;border-radius:20px;cursor:pointer;
    font-weight:800;font-size:.8em;background:#fff;box-shadow:2px 2px 0 #000;touch-action:manipulation;}
  .month-tab.active{background:var(--orange);color:#fff;}

  table{width:100%;border-collapse:collapse;font-size:.85em;background:#fff;border:3px solid #000;border-radius:8px;overflow:hidden;}
  th,td{padding:8px 8px;text-align:left;border-bottom:2px solid #eee;}
  th{background:var(--dark);color:#fff;font-weight:800;font-size:.82em;}
  tr.me{background:linear-gradient(90deg,#fff3cd,#ffe0b2);font-weight:800;}
  tr:last-child td{border-bottom:none;}
  .rank-badge{display:inline-block;min-width:26px;padding:2px 6px;border-radius:6px;background:var(--orange);color:#fff;
    font-weight:900;text-align:center;font-size:.82em;}
  .rank-badge.gold{background:#f9a825;} .rank-badge.silver{background:#9e9e9e;} .rank-badge.bronze{background:#a1887f;}

  .post{border-bottom:2px dashed #ccc;padding:10px 0;content-visibility:auto;contain-intrinsic-size:80px;}
  .post:last-child{border-bottom:none;}
  .post-meta{font-size:.76em;color:#555;}
  .empty{color:#666;font-style:italic;font-size:.88em;}
  .err{color:#c00;font-weight:700;margin-top:8px;word-break:break-word;font-size:.9em;}
  .ok{color:#2e7d32;font-weight:700;margin-top:8px;font-size:.9em;}
  .team-dp{width:52px;height:52px;border:3px solid #000;border-radius:8px;image-rendering:pixelated;background:#fff;flex-shrink:0;}
  .banner{background:linear-gradient(135deg,#ffb347,#ff8c00);color:#fff;text-shadow:1px 1px 0 #000;
    padding:12px 14px;border:4px solid #000;border-radius:12px;box-shadow:5px 5px 0 rgba(0,0,0,.35);
    margin-bottom:14px;display:flex;align-items:center;gap:12px;}
  .banner h2{font-size:1.05em;line-height:1.2;}
  .skeleton{animation:sk 1.2s ease-in-out infinite;}
  .sk-line{background:#ccc;border-radius:6px;height:14px;margin:8px 0;}
  @keyframes sk{0%,100%{opacity:1}50%{opacity:.5}}

  #snakeOverlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;
    justify-content:center;align-items:center;z-index:200;padding:10px;touch-action:none;}
  #snakeOverlay.show{display:flex;}
  #snakeCanvas{background:#111;border:4px solid var(--orange);max-width:92vw;max-height:60vh;touch-action:none;}
  .game-label{color:#fff;font-family:'Courier New',monospace;margin-bottom:6px;font-size:.95em;text-align:center;}
  .game-score{color:var(--orange);font-family:'Courier New',monospace;font-size:1.2em;font-weight:900;margin-bottom:4px;}
  .game-hint{color:#aaa;font-size:.78em;margin-top:8px;text-align:center;}

  @media(max-width:600px){
    .brand-title{font-size:.68em;} .logo{height:36px;}
    .container{padding:10px;}
    .card{padding:12px;}
    .btn-row .btn{flex:1 1 46%;min-height:46px;padding:12px 14px;font-size:.9em;}
    .stats-card{grid-template-columns:repeat(3,1fr);padding:10px;gap:6px;}
    .stat-value{font-size:.9em;} .stat-label{font-size:.45em;}
    .team-dp{width:44px;height:44px;}
    table{font-size:.78em;}
    th,td{padding:6px 6px;}
    .user-info span{max-width:80px;}
  }
  @media(max-width:380px){
    .brand-title{display:none;}
  }
</style>
</head>
<body>

<div id="sky"></div>
<div id="clouds"></div>
<div id="ground"></div>

<header>
  <div class="brand-wrap">
    <img src="./LOGO.png" alt="ACI" class="logo" onerror="this.style.display='none'">
    <span class="brand-title">ACI Careeredge<br>Campus Lead</span>
  </div>
  <div class="user-info" id="userInfo" style="display:none;">
    <span id="headerName"></span>
    <a id="adminLink" href="admin.html" style="display:none;color:#fff;background:#c62828;padding:4px 9px;border-radius:20px;font-weight:800;font-size:.75em;text-decoration:none;border:2px solid #000;box-shadow:2px 2px 0 #000;">⚙️</a>
    <button class="btn btn-warn" style="padding:6px 10px;min-height:0;font-size:.78em;" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">
  <div id="loginView" class="card" style="max-width:440px;margin:40px auto;">
    <h2>🎓 ACI Careeredge</h2>
    <p style="margin-bottom:14px;font-size:.88em;color:#555;">Enter your email and CL Code to continue.</p>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" autocapitalize="off" spellcheck="false">
    <label>CL Code</label>
    <input type="text" id="loginCode" placeholder="CL0103" autocomplete="username" maxlength="12"
           autocapitalize="characters" spellcheck="false"
           style="text-transform:uppercase;letter-spacing:2px;text-align:center;font-weight:700;">
    <button class="btn btn-primary" style="width:100%;" id="loginBtn" onclick="handleLogin(this)">Enter</button>
    <p id="loginError" class="err"></p>
    <p id="loginOk" class="ok"></p>
  </div>

  <div id="mainView" style="display:none;">
    <div class="banner">
      <img id="myTeamDP" class="team-dp" alt="">
      <div style="min-width:0;">
        <h2 id="welcomeTitle">Welcome!</h2>
        <div style="font-size:.82em;opacity:.95;" id="welcomeSub"></div>
      </div>
    </div>

    <div class="stats-card" id="statsCard">
      <div class="stat-box"><span class="stat-label">TODAY</span><div class="stat-value" id="statDay">0</div></div>
      <div class="stat-box"><span class="stat-label">WEEK</span><div class="stat-value" id="statWeek">0</div></div>
      <div class="stat-box"><span class="stat-label">MONTH</span><div class="stat-value" id="statMonth">0</div></div>
      <div class="stat-box total"><span class="stat-label">YOU</span><div class="stat-value" id="statTotal">0</div></div>
      <div class="stat-box team"><span class="stat-label">TEAM</span><div class="stat-value" id="statTeam">0</div></div>
    </div>

    <div class="btn-row">
      <a class="btn btn-primary" id="goTeamBtn" href="#" style="text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">🎯 My Team</a>
      <button class="btn btn-secondary" onclick="refreshAll(this)">🔄 Refresh</button>
    </div>

    <div class="card">
      <h3>🏆 Individual Leaderboard</h3>
      <div class="month-tabs" id="monthTabs"></div>
      <div id="indLbBox"></div>
    </div>

    <div class="card">
      <h3>🛡️ Team Leaderboard</h3>
      <div id="teamLbBox"></div>
    </div>

    <div class="card">
      <h3>🌍 Global Feed</h3>
      <textarea id="globalMsg" rows="3" maxlength="800" placeholder="Share a thought with the campus…"></textarea>
      <button class="btn btn-warn" style="width:100%;" onclick="postGlobal(this)">📣 Post to Global</button>
      <div id="globalBox" style="margin-top:12px;"></div>
    </div>
  </div>
</div>

<div id="snakeOverlay">
  <div class="game-label">🎓 Loading…</div>
  <div class="game-score">Score: <span id="snakeScore">0</span></div>
  <canvas id="snakeCanvas" width="320" height="320"></canvas>
  <div class="game-hint">Tap arrows or swipe to play</div>
</div>

<script>
(function lockDown(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); }, {capture:true});
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toUpperCase();
    if (k === 'F12') { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && ['I','J','C','K','M'].indexOf(k) !== -1) { e.preventDefault(); return false; }
    if (e.ctrlKey && ['U','S','P'].indexOf(k) !== -1) { e.preventDefault(); return false; }
  }, {capture:true});
  document.addEventListener('dragstart', function(e){ e.preventDefault(); }, {capture:true});
})();

var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if (!isMobile){
  window.addEventListener('scroll', function(){
    var y = window.pageYOffset;
    var s = document.getElementById('sky');
    var c = document.getElementById('clouds');
    if (s) s.style.transform = 'translateY(' + (y * 0.35) + 'px)';
    if (c) c.style.transform = 'translateY(' + (y * 0.6) + 'px)';
  }, {passive:true});
}

var API_URL = 'https://script.google.com/macros/s/AKfycbyp-3MaW7JqdPgNN0lDw3RnAotlFIcK3vQDNfADIdVcNiMVshaFGZKhZqmGKNcGKYYA/exec';
var $ = function(id){ return document.getElementById(id); };
var LS_USER = 'aci_user';
var user = null;
var currentMonth = '';
var monthsList = [];

/* ---------- SNAKE ---------- */
var snakeGameId = 0;
function showSnake(){
  snakeGameId++;
  var id = snakeGameId;
  $('snakeOverlay').classList.add('show');
  startSnake(id);
}
function hideSnake(){
  snakeGameId++;
  $('snakeOverlay').classList.remove('show');
}
function startSnake(myId){
  var oldCanvas = $('snakeCanvas');
  var canvas = oldCanvas.cloneNode(true);
  oldCanvas.parentNode.replaceChild(canvas, oldCanvas);
  var ctx = canvas.getContext('2d');
  var GRID = 16;
  var SIZE = canvas.width / GRID;
  var codes = ['1','2','3','4','5','6','7','8'];
  var imgs = codes.map(function(c){ var i = new Image(); i.src = './' + c + '.png'; return i; });

  var state = {
    snake: [{x:8,y:8},{x:7,y:8},{x:6,y:8}],
    dir: {x:1,y:0},
    food: {x:12,y:8,idx:0},
    score: 0, over: false
  };
  function placeFood(){
    var attempts = 0;
    do {
      state.food.x = Math.floor(Math.random() * GRID);
      state.food.y = Math.floor(Math.random() * GRID);
      state.food.idx = (state.food.idx + 1) % imgs.length;
      attempts++;
    } while (state.snake.some(function(s){ return s.x === state.food.x && s.y === state.food.y; }) && attempts < 50);
  }
  function draw(){
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#1f1f1f';
    for (var i = 0; i <= GRID; i++){
      ctx.beginPath(); ctx.moveTo(i*SIZE, 0); ctx.lineTo(i*SIZE, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*SIZE); ctx.lineTo(canvas.width, i*SIZE); ctx.stroke();
    }
    state.snake.forEach(function(s, i){
      ctx.fillStyle = (i === 0) ? '#ff8c00' : '#2e7d32';
      ctx.fillRect(s.x*SIZE+1, s.y*SIZE+1, SIZE-2, SIZE-2);
      ctx.strokeStyle = '#000';
      ctx.strokeRect(s.x*SIZE+1, s.y*SIZE+1, SIZE-2, SIZE-2);
    });
    var img = imgs[state.food.idx];
    if (img.complete && img.naturalWidth){
      ctx.drawImage(img, state.food.x*SIZE, state.food.y*SIZE, SIZE, SIZE);
    } else {
      ctx.fillStyle = '#ff8c00';
      ctx.fillRect(state.food.x*SIZE, state.food.y*SIZE, SIZE, SIZE);
    }
    $('snakeScore').textContent = state.score;
  }
  function step(){
    if (myId !== snakeGameId) return;
    if (state.over) return;
    var head = { x: state.snake[0].x + state.dir.x, y: state.snake[0].y + state.dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        state.snake.some(function(s){ return s.x === head.x && s.y === head.y; })){
      state.over = true;
      setTimeout(function(){
        if (myId !== snakeGameId) return;
        state.snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
        state.dir = {x:1,y:0}; state.score = 0; state.over = false;
        placeFood();
      }, 700);
      return;
    }
    state.snake.unshift(head);
    if (head.x === state.food.x && head.y === state.food.y){ state.score++; placeFood(); }
    else state.snake.pop();
    draw();
  }
  var keyHandler = function(e){
    if (myId !== snakeGameId) return;
    var k = e.key;
    if (k === 'ArrowUp'    && state.dir.y === 0) state.dir = {x:0,y:-1};
    if (k === 'ArrowDown'  && state.dir.y === 0) state.dir = {x:0,y:1};
    if (k === 'ArrowLeft'  && state.dir.x === 0) state.dir = {x:-1,y:0};
    if (k === 'ArrowRight' && state.dir.x === 0) state.dir = {x:1,y:0};
    if (k.indexOf('Arrow') === 0) e.preventDefault();
  };
  document.addEventListener('keydown', keyHandler);

  var tsX = 0, tsY = 0;
  canvas.addEventListener('touchstart', function(e){
    tsX = e.touches[0].clientX; tsY = e.touches[0].clientY;
  }, {passive:true});
  canvas.addEventListener('touchend', function(e){
    if (myId !== snakeGameId) return;
    var dx = e.changedTouches[0].clientX - tsX;
    var dy = e.changedTouches[0].clientY - tsY;
    if (Math.abs(dx) > Math.abs(dy)){
      if (dx > 0 && state.dir.x === 0) state.dir = {x:1,y:0};
      else if (dx < 0 && state.dir.x === 0) state.dir = {x:-1,y:0};
    } else {
      if (dy > 0 && state.dir.y === 0) state.dir = {x:0,y:1};
      else if (dy < 0 && state.dir.y === 0) state.dir = {x:0,y:-1};
    }
  }, {passive:true});

  var tick = setInterval(function(){
    if (myId !== snakeGameId){
      clearInterval(tick);
      document.removeEventListener('keydown', keyHandler);
      return;
    }
    step();
  }, 160);

  placeFood();
  draw();
}

/* ---------- API ---------- */
function api(action, payload){
  payload = payload || {};
  var body = JSON.stringify(Object.assign({action: action}, payload));
  return fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: body, redirect: 'follow', cache: 'no-store'
  }).then(function(res){
    return res.text().then(function(text){
      if (!text) throw new Error('Empty response.');
      try { return JSON.parse(text); }
      catch (je){
        if (text.indexOf('<html') >= 0 || text.indexOf('<!DOCTYPE') >= 0)
          throw new Error('Deployment access must be set to "Anyone".');
        throw new Error('Unexpected server response.');
      }
    });
  });
}
function esc(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function badge(r){ return r <= 3 ? 'gold silver bronze'.split(' ')[r-1] : ''; }

var snakeShown = false;
function withSnake(fn){
  var timer = setTimeout(function(){
    if (!snakeShown){ snakeShown = true; showSnake(); }
  }, 450);
  return Promise.resolve().then(fn).finally(function(){
    clearTimeout(timer);
    if (snakeShown){
      snakeShown = false;
      setTimeout(hideSnake, 180);
    }
  });
}

/* ---------- LOGIN ---------- */
function handleLogin(btn){
  var email = $('loginEmail').value.trim();
  var code  = $('loginCode').value.trim();
  $('loginError').textContent = '';
  $('loginOk').textContent = '';
  if (!email || !code){ $('loginError').textContent = 'Email and Code required.'; return; }
  var orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Entering…';
  withSnake(function(){ return api('login', { email: email, code: code }); })
    .then(function(r){
      if (!r.success){ $('loginError').textContent = r.message || 'Login failed.'; return; }
      $('loginOk').textContent = 'Welcome ' + r.user.name + '!';
      user = r.user;
      localStorage.setItem(LS_USER, JSON.stringify(user));
      sessionStorage.setItem('aci_team_user', JSON.stringify(user));
      enterApp();
    })
    .catch(function(e){ $('loginError').textContent = e.message || 'Connection failed.'; })
    .finally(function(){ btn.disabled = false; btn.textContent = orig; });
}
function logout(){
  localStorage.removeItem(LS_USER);
  sessionStorage.removeItem('aci_team_user');
  location.reload();
}

window.addEventListener('load', function(){
  var saved = localStorage.getItem(LS_USER);
  if (saved){
    try { user = JSON.parse(saved); enterApp(); }
    catch (e) { localStorage.removeItem(LS_USER); }
  }
  fetch(API_URL + '?action=ping', {cache:'no-store'}).catch(function(){});
}, {once:true});

function enterApp(){
  $('loginView').style.display = 'none';
  $('mainView').style.display = 'block';
  $('userInfo').style.display = 'flex';
  $('headerName').textContent = user.name + ' (' + user.code + ')';
  $('adminLink').style.display = user.isAdmin ? 'inline-block' : 'none';
  $('welcomeTitle').textContent = 'Hi ' + user.name + '!';
  $('welcomeSub').textContent = user.teamName + ' — ' + user.code;
  var dp = $('myTeamDP');
  if (user.teamNumber && user.teamNumber > 0){
    dp.src = './' + user.teamNumber + '.png';
    dp.onerror = function(){ this.style.visibility = 'hidden'; };
  } else {
    dp.style.visibility = 'hidden';
  }
  $('goTeamBtn').href = 'team.html?t=' + user.teamNumber;
  if (!user.teamNumber || user.teamNumber === 0) $('goTeamBtn').style.display = 'none';
  loadBootstrap();
}

function loadBootstrap(){
  $('indLbBox').innerHTML = '<div class="skeleton"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>';
  $('teamLbBox').innerHTML = '<div class="skeleton"><div class="sk-line"></div><div class="sk-line"></div></div>';
  $('globalBox').innerHTML = '<div class="skeleton"><div class="sk-line"></div><div class="sk-line"></div></div>';
  withSnake(function(){ return api('bootstrap', {code: user.code}); })
    .then(function(r){
      if (!r.success) return;
      if (r.stats) paintStats(r.stats);
      if (r.months){ monthsList = r.months; currentMonth = r.currentMonth || monthsList[0]; renderMonthTabs(); }
      if (r.leaderboards){
        renderIndividual(r.leaderboards.individual);
        renderTeam(r.leaderboards.team);
      }
      if (r.global) renderGlobal(r.global);
    })
    .catch(function(e){ console.error(e); });
}
function refreshAll(btn){
  var o = btn.textContent;
  btn.disabled = true; btn.textContent = 'Loading…';
  loadBootstrap().then(function(){ btn.disabled = false; btn.textContent = o; });
}
function paintStats(s){
  $('statDay').textContent   = s.day;
  $('statWeek').textContent  = s.week;
  $('statMonth').textContent = s.month;
  $('statTotal').textContent = s.total;
  $('statTeam').textContent  = s.teamMonth;
}
function prettyMonth(m){
  var parts = m.split('-');
  var names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return names[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
}
function renderMonthTabs(){
  var html = '';
  for (var i = 0; i < monthsList.length; i++){
    var m = monthsList[i];
    html += '<button class="month-tab' + (m === currentMonth ? ' active' : '') + '" ' +
            'onclick="switchMonth(\'' + m + '\')">' + prettyMonth(m) + '</button>';
  }
  $('monthTabs').innerHTML = html;
}
function switchMonth(m){
  currentMonth = m;
  renderMonthTabs();
  $('indLbBox').innerHTML = '<div class="skeleton"><div class="sk-line"></div><div class="sk-line"></div></div>';
  $('teamLbBox').innerHTML = '<div class="skeleton"><div class="sk-line"></div><div class="sk-line"></div></div>';
  withSnake(function(){ return api('getLeaderboards', {month: m}); })
    .then(function(r){ if (r.success){ renderIndividual(r.individual); renderTeam(r.team); } })
    .catch(function(){});
}
function renderIndividual(list){
  if (!list || !list.length){ $('indLbBox').innerHTML = '<p class="empty">No scores this month.</p>'; return; }
  var p = ['<table><thead><tr><th>#</th><th>Name</th><th>Team</th><th>Pts</th></tr></thead><tbody>'];
  for (var i = 0; i < list.length; i++){
    var u = list[i];
    var me = user && u.code === user.code ? ' class="me"' : '';
    p.push('<tr' + me + '><td><span class="rank-badge ' + badge(u.rank) + '">' + u.rank + '</span></td>' +
      '<td>' + esc(u.name) + '<div style="font-size:.72em;color:#666;">' + esc(u.code) + '</div></td>' +
      '<td>' + esc(u.teamName) + '</td><td><strong>' + u.points + '</strong></td></tr>');
  }
  p.push('</tbody></table>');
  $('indLbBox').innerHTML = p.join('');
}
function renderTeam(list){
  if (!list || !list.length){ $('teamLbBox').innerHTML = '<p class="empty">No scores this month.</p>'; return; }
  var p = ['<table><thead><tr><th>#</th><th>Team</th><th>Pts</th></tr></thead><tbody>'];
  for (var i = 0; i < list.length; i++){
    var t = list[i];
    var me = user && t.teamNumber === user.teamNumber ? ' class="me"' : '';
    p.push('<tr' + me + '><td><span class="rank-badge ' + badge(t.rank) + '">' + t.rank + '</span></td>' +
      '<td>' + esc(t.teamName) + '</td><td><strong>' + t.points + '</strong></td></tr>');
  }
  p.push('</tbody></table>');
  $('teamLbBox').innerHTML = p.join('');
}
function renderGlobal(data){
  var anns = (data && data.announcements) || [];
  var posts = (data && data.posts) || [];
  var p = [];
  for (var i = 0; i < anns.length; i++){
    var a = anns[i];
    var dt = new Date(a.timestamp).toLocaleString();
    p.push('<div style="background:linear-gradient(135deg,#ffb347,#ff8c00);color:#fff;border:3px solid #000;' +
      'border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:3px 3px 0 rgba(0,0,0,.35);text-shadow:1px 1px 0 rgba(0,0,0,.3);">' +
      '<div style="font-size:.72em;opacity:.9;margin-bottom:3px;">📢 <strong>Announcement</strong> · ' + esc(a.name) + ' · ' + dt + '</div>' +
      '<div style="font-weight:700;">' + esc(a.message) + '</div></div>');
  }
  for (var j = 0; j < posts.length; j++){
    var g = posts[j];
    var dt2 = new Date(g.timestamp).toLocaleString();
    p.push('<div class="post"><div class="post-meta"><strong>' + esc(g.name) + '</strong> · ' +
      esc(g.teamName) + ' · ' + dt2 + '</div>' +
      '<div style="margin-top:4px;">' + esc(g.message) + '</div></div>');
  }
  if (!p.length) p.push('<p class="empty">No posts yet. Be the first!</p>');
  $('globalBox').innerHTML = p.join('');
}
function postGlobal(btn){
  var msg = $('globalMsg').value.trim();
  if (!msg){ alert('Type a message first.'); return; }
  var o = btn.textContent;
  btn.disabled = true; btn.textContent = 'Posting…';
  withSnake(function(){ return api('submitGlobalPost', {code: user.code, message: msg}); })
    .then(function(r){
      if (!r.success){ alert(r.message || 'Failed.'); return; }
      $('globalMsg').value = '';
      return api('getGlobalPosts').then(function(g){ renderGlobal(g); });
    })
    .catch(function(e){ alert(e.message || 'Failed.'); })
    .finally(function(){ btn.disabled = false; btn.textContent = o; });
}
</script>
</body>
</html>
