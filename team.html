<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Team Dashboard — Clan Orange</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1bddff;--ground:#2e7d32;--card:rgba(255,255,255,.95);--orange:#ff8c00;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);min-height:100vh;overflow-x:hidden;color:#1a1a1a;}
  #sky{position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#1bddff,#45e3ff 60%,#a8f0ff);}
  #ground{position:fixed;bottom:0;left:0;width:100%;height:120px;z-index:-1;background:var(--ground);
    box-shadow:inset 0 6px 0 #1b5e20,inset 0 -10px 0 #1b3d12;
    background-image:repeating-linear-gradient(90deg,#2e7d32 0 40px,#276b2b 40px 80px);}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;
    background:rgba(0,0,0,.35);backdrop-filter:blur(6px);border-bottom:4px solid #000;
    position:sticky;top:0;z-index:50;}
  .brand-title{font-family:'Press Start 2P',monospace;font-size:1.05em;color:#fff;
    text-shadow:2px 2px 0 #000,4px 4px 0 #ff8c00;letter-spacing:1px;}
  .user-info{display:flex;align-items:center;gap:12px;color:#fff;font-weight:700;font-size:.9em;}
  .container{max-width:820px;margin:0 auto;padding:18px;}
  .card{background:var(--card);border:4px solid #000;border-radius:12px;padding:18px;margin-bottom:16px;
    box-shadow:6px 6px 0 rgba(0,0,0,.35);}
  .card h2,.card h3{margin-bottom:10px;}
  input,textarea,select{width:100%;padding:10px 12px;margin-bottom:10px;border:3px solid #000;border-radius:8px;font-size:1em;background:#fff;}
  label{font-weight:600;display:block;margin-bottom:4px;font-size:.9em;}
  .btn{padding:10px 18px;border:3px solid #000;border-radius:8px;cursor:pointer;font-weight:800;font-size:.95em;
    background:#fff;color:#000;box-shadow:3px 3px 0 #000;transition:transform .06s;}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;}
  .btn:disabled{opacity:.6;cursor:wait;}
  .btn-primary{background:var(--ground);color:#fff;}
  .btn-warn{background:var(--orange);color:#fff;}
  .pill{display:inline-block;padding:3px 9px;border-radius:12px;background:#e0f7fa;border:2px solid #000;
    font-size:.78em;font-weight:700;margin:2px 4px 2px 0;}
  .pill.absent{background:#ffcdd2;}
  .pill.present{background:#c8e6c9;}
  .post{border:3px solid #000;border-radius:10px;padding:12px;margin-bottom:10px;background:#fff;
    box-shadow:3px 3px 0 rgba(0,0,0,.25);content-visibility:auto;contain-intrinsic-size:100px;}
  .post.mine{background:linear-gradient(135deg,#fff3cd,#ffe0b2);}
  .post-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px;}
  .post-name{font-weight:800;}
  .post-date{font-size:.78em;color:#555;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .empty{color:#666;font-style:italic;font-size:.9em;}
  .err{color:#c00;font-weight:700;}
  .banner{background:linear-gradient(135deg,#ffb347,#ff8c00);color:#fff;text-shadow:1px 1px 0 #000;
    padding:14px 18px;border:4px solid #000;border-radius:12px;box-shadow:6px 6px 0 rgba(0,0,0,.35);margin-bottom:16px;
    display:flex;align-items:center;gap:14px;}
  .team-dp{width:64px;height:64px;border:3px solid #000;border-radius:10px;image-rendering:pixelated;background:#fff;}
  .banner h2{font-size:1.1em;}
  .banner .sub{font-size:.85em;opacity:.95;}
  @media(max-width:600px){.brand-title{font-size:.8em;} .container{padding:12px;} .grid2{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="sky"></div>
<div id="ground"></div>

<header>
  <span class="brand-title">🍊 Clan Orange</span>
  <div class="user-info">
    <a href="index.html" style="color:#fff;text-decoration:none;font-weight:800;">← Leaderboard</a>
    <span id="headerName"></span>
    <button class="btn btn-warn" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">
  <div class="banner">
    <img id="teamDP" class="team-dp" alt="">
    <div><h2 id="teamTitle">Team</h2><div class="sub" id="teamSub"></div></div>
  </div>

  <div class="card">
    <h3 id="formTitle">📝 Submit Your Work</h3>
    <label>📅 Date</label>
    <input type="date" id="eDate">
    <div class="grid2">
      <div><label>Attendance</label>
        <select id="eAttendance">
          <option value="Present">Present</option>
          <option value="Absent">Absent</option>
        </select></div>
      <div><label>Working Minutes</label><input type="number" id="eMinutes" value="0" min="0"></div>
      <div><label>Promotional Posts</label><input type="number" id="ePromos" value="0" min="0"></div>
      <div><label>Successful Applications</label><input type="number" id="eApps" value="0" min="0"></div>
      <div><label>Successful Registrations</label><input type="number" id="eRegs" value="0" min="0"></div>
    </div>
    <label>Remarks (optional)</label>
    <textarea id="eRemarks" rows="2" placeholder="Anything worth noting?"></textarea>
    <button class="btn btn-primary" style="width:100%;" id="submitBtn" onclick="submitEntry(this)">🚀 Submit</button>
    <p id="formMsg" style="margin-top:8px;font-weight:700;"></p>
  </div>

  <div class="card">
    <h3>👥 Team Feed</h3>
    <p style="font-size:.85em;color:#555;margin-bottom:10px;">Today &amp; yesterday — only your team can see this.</p>
    <div id="feedBox"></div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyp-3MaW7JqdPgNN0lDw3RnAotlFIcK3vQDNfADIdVcNiMVshaFGZKhZqmGKNcGKYYA/exec';
const $ = id => document.getElementById(id);
let user = null;

function pad(n){return String(n).padStart(2,'0');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function yesterdayStr(){const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function api(action, payload) {
  payload = payload || {};
  const res = await fetch(API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action}, payload)), redirect:'follow', cache:'no-store'
  });
  if (!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
function logout(){ localStorage.removeItem('co_user'); sessionStorage.removeItem('co_team_user'); location.href='index.html'; }

/* Debounce helper for the date-change lookup */
function debounce(fn, ms) { let t; return function(){ const a=arguments, c=this; clearTimeout(t); t=setTimeout(()=>fn.apply(c,a), ms); }; }

/* ---------- BOOT ---------- */
window.addEventListener('load', () => {
  // Prefer session cache primed by index.html (instant), fall back to localStorage
  let saved = sessionStorage.getItem('co_team_user') || localStorage.getItem('co_user');
  if (!saved) { location.href = 'index.html'; return; }
  try { user = JSON.parse(saved); } catch(e){ location.href='index.html'; return; }

  const qp = new URLSearchParams(location.search);
  const t = Number(qp.get('t'));
  if (t && t !== user.teamNumber) {
    location.replace('team.html?t=' + user.teamNumber);
    return;
  }

  $('headerName').textContent = user.name + ' (' + user.code + ')';
  $('teamTitle').textContent  = user.teamName;
  $('teamSub').textContent    = 'Team ' + user.teamNumber + ' · ' + user.code;

  const dp = $('teamDP');
  dp.src = './' + user.teamNumber + '.png';
  dp.onerror = function(){ this.style.visibility = 'hidden'; };

  const dateInput = $('eDate');
  dateInput.min = yesterdayStr();
  dateInput.max = todayStr();
  dateInput.value = todayStr();
  dateInput.addEventListener('change', debounce(loadMyEntry, 200));

  // Fire both in parallel
  loadMyEntry();
  loadTeamPosts();
}, { once:true });

/* ---------- MY ENTRY ---------- */
async function loadMyEntry() {
  const date = $('eDate').value;
  if (!date) return;
  $('formMsg').textContent = '';
  try {
    const r = await api('getMyEntry', { code: user.code, date });
    const e = r.entry;
    if (e) {
      $('formTitle').textContent = '✏️ Edit Your Entry for ' + date;
      $('submitBtn').textContent = '💾 Update Entry';
      $('eAttendance').value = e.attendance || 'Present';
      $('eMinutes').value = e.minutes;
      $('ePromos').value  = e.promos;
      $('eApps').value    = e.apps;
      $('eRegs').value    = e.regs;
      $('eRemarks').value = e.remarks || '';
    } else {
      $('formTitle').textContent = '📝 Submit Your Work';
      $('submitBtn').textContent = '🚀 Submit';
      $('eAttendance').value = 'Present';
      $('eMinutes').value = 0; $('ePromos').value = 0;
      $('eApps').value = 0;    $('eRegs').value = 0;
      $('eRemarks').value = '';
    }
  } catch (e) { console.error(e); }
}

async function submitEntry(btn) {
  const date = $('eDate').value;
  if (!date) { $('formMsg').textContent = 'Please pick a date.'; return; }
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Saving…';
  $('formMsg').textContent = '';
  try {
    const r = await api('submitEntry', {
      code: user.code, date,
      attendance: $('eAttendance').value,
      minutes: Number($('eMinutes').value) || 0,
      promos:  Number($('ePromos').value)  || 0,
      apps:    Number($('eApps').value)    || 0,
      regs:    Number($('eRegs').value)    || 0,
      remarks: $('eRemarks').value
    });
    if (!r.success) { $('formMsg').textContent = r.message; $('formMsg').style.color = '#c00'; return; }
    $('formMsg').textContent = r.updated ? '✅ Entry updated!' : '✅ Entry saved!';
    $('formMsg').style.color = '#2e7d32';

    // Invalidate dashboard cache so it re-fetches fresh leaderboards next time
    localStorage.removeItem('co_lb');

    // Refresh locally without refetching everything
    await Promise.all([loadMyEntry(), loadTeamPosts()]);
  } catch (e) {
    $('formMsg').textContent = 'Failed. Try again.'; $('formMsg').style.color = '#c00';
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}

/* ---------- TEAM POSTS ---------- */
async function loadTeamPosts() {
  if (!$('feedBox').innerHTML) {
    $('feedBox').innerHTML = '<p class="empty">Loading…</p>';
  }
  try {
    const r = await api('getTeamPosts', { teamNumber: user.teamNumber });
    const posts = r.posts || [];
    if (!posts.length) {
      $('feedBox').innerHTML = '<p class="empty">No entries from your team for today or yesterday yet.</p>';
      return;
    }
    // Build in one shot
    const parts = [];
    for (const p of posts) {
      const mine = p.code === user.code ? ' mine' : '';
      const attCls = p.attendance === 'Absent' ? 'absent' : 'present';
      const dt = new Date(p.updatedAt).toLocaleString();
      parts.push(
        '<div class="post'+mine+'">'+
          '<div class="post-head">'+
            '<div><span class="post-name">'+esc(p.name)+'</span> <span style="color:#666;font-size:.85em;">('+esc(p.code)+')</span></div>'+
            '<div class="post-date">'+esc(p.date)+' · updated '+dt+'</div>'+
          '</div>'+
          '<div>'+
            '<span class="pill '+attCls+'">'+esc(p.attendance)+'</span>'+
            '<span class="pill">⏱ '+p.minutes+'m</span>'+
            '<span class="pill">📢 '+p.promos+'</span>'+
            '<span class="pill">📝 '+p.apps+'</span>'+
            '<span class="pill">✅ '+p.regs+'</span>'+
          '</div>'+
          (p.remarks ? '<div style="margin-top:6px;font-style:italic;color:#333;">“'+esc(p.remarks)+'”</div>' : '')+
        '</div>'
      );
    }
    $('feedBox').innerHTML = parts.join('');
  } catch (e) {
    $('feedBox').innerHTML = '<p class="err">Failed to load feed.</p>';
  }
}
</script>
</body>
</html>
