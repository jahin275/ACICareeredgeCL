<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a3d62">
<title>Work Submission — ACI CareerEDGE</title>
<link rel="icon" href="./favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="preload" as="image" href="./LOGO.png">
<link rel="prefetch" href="./index.html">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1bddff;--ground:#2e7d32;--card:rgba(255,255,255,.94);--orange:#ff8c00;--text:#1a1a1a;--dark:#0d2b3e;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;}
  body{user-select:none;-webkit-user-select:none;}
  input,textarea,select{user-select:text;-webkit-user-select:text;}
  img{-webkit-user-drag:none;pointer-events:none;}
  #sky{position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:radial-gradient(circle at 20% 20%, #fff6 0 4px, transparent 5px),
      radial-gradient(circle at 70% 40%, #fff6 0 6px, transparent 7px),
      linear-gradient(180deg, #1bddff 0%, #45e3ff 60%, #a8f0ff 100%);
    background-size:200px 200px,300px 300px,100% 100%;will-change:transform;}
  #clouds{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:radial-gradient(ellipse 80px 30px at 15% 15%, #fff, transparent 70%),
      radial-gradient(ellipse 100px 35px at 60% 25%, #fff, transparent 70%);
    opacity:.5;will-change:transform;}
  #ground{position:fixed;bottom:0;left:0;width:100%;height:100px;z-index:-1;pointer-events:none;background:var(--ground);
    box-shadow:inset 0 6px 0 #1b5e20;
    background-image:repeating-linear-gradient(90deg,#2e7d32 0 40px,#276b2b 40px 80px);}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
    background:rgba(0,0,0,.4);backdrop-filter:blur(6px);border-bottom:4px solid #000;
    position:sticky;top:0;z-index:50;padding-top:max(10px, env(safe-area-inset-top));}
  .brand-wrap{display:flex;align-items:center;gap:10px;min-width:0;}
  .logo{height:40px;image-rendering:pixelated;flex-shrink:0;}
  .brand-title{font-family:'Press Start 2P',monospace;font-size:.75em;color:#fff;
    text-shadow:2px 2px 0 #000,3px 3px 0 #ff8c00;letter-spacing:1px;line-height:1.3;
    -webkit-font-smoothing:none;white-space:nowrap;}
  .user-info{display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:.8em;min-width:0;}
  .user-info a{color:#fff;text-decoration:none;font-weight:800;padding:6px 8px;border-radius:6px;
    background:rgba(0,0,0,.25);border:2px solid #000;min-height:36px;display:inline-flex;align-items:center;}
  .user-info span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;}
  .syncing{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2e7d32;margin-right:4px;
    box-shadow:0 0 6px #2e7d32;animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .container{max-width:820px;margin:0 auto;padding:14px;padding-bottom:max(20px, env(safe-area-inset-bottom));}
  .card{background:var(--card);border:4px solid #000;border-radius:12px;padding:16px;margin-bottom:14px;
    box-shadow:5px 5px 0 rgba(0,0,0,.35);}
  .card h2,.card h3{margin-bottom:10px;font-size:1.05em;}
  input,textarea,select{width:100%;padding:14px;margin-bottom:10px;border:3px solid #000;border-radius:8px;
    background:#fff;font-size:16px;touch-action:manipulation;}
  select{appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat:no-repeat;background-position:right 10px center;background-size:20px;}
  label{font-weight:600;display:block;margin-bottom:4px;font-size:.88em;}
  .btn{padding:14px 20px;min-height:48px;border:3px solid #000;border-radius:8px;cursor:pointer;
    font-weight:800;font-size:1em;background:#fff;color:#000;box-shadow:3px 3px 0 #000;
    transition:transform .06s;touch-action:manipulation;}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;}
  .btn:disabled{opacity:.6;cursor:wait;}
  .btn-primary{background:var(--ground);color:#fff;}
  .btn-warn{background:var(--orange);color:#fff;}
  .btn-secondary{background:#b0bec5;}
  .pill{display:inline-block;padding:3px 9px;border-radius:12px;background:#e0f7fa;border:2px solid #000;
    font-size:.76em;font-weight:700;margin:2px 4px 2px 0;}
  .pill.absent{background:#ffcdd2;}
  .pill.present{background:#c8e6c9;}
  .pill.readonly{background:#f5f5f5;color:#666;border-style:dashed;}
  .post{border:3px solid #000;border-radius:10px;padding:12px;margin-bottom:10px;background:#fff;
    box-shadow:3px 3px 0 rgba(0,0,0,.25);content-visibility:auto;contain-intrinsic-size:100px;}
  .post.mine{background:linear-gradient(135deg,#fff3cd,#ffe0b2);}
  .post-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px;}
  .post-name{font-weight:800;}
  .post-date{font-size:.76em;color:#555;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .empty{color:#666;font-style:italic;font-size:.88em;}
  .err{color:#c00;font-weight:700;font-size:.9em;}
  .ok{color:#2e7d32;font-weight:700;font-size:.9em;}
  .banner{background:linear-gradient(135deg,#ffb347,#ff8c00);color:#fff;text-shadow:1px 1px 0 #000;
    padding:12px 14px;border:4px solid #000;border-radius:12px;box-shadow:5px 5px 0 rgba(0,0,0,.35);
    margin-bottom:14px;display:flex;align-items:center;gap:12px;}
  .team-dp{width:56px;height:56px;border:3px solid #000;border-radius:10px;image-rendering:pixelated;background:#fff;flex-shrink:0;}
  .banner h2{font-size:1.05em;line-height:1.2;}
  .banner .sub{font-size:.82em;opacity:.95;}
  .note{font-size:.78em;color:#555;font-style:italic;margin:-4px 0 8px;}
  .summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
  .sum-box{text-align:center;padding:10px 4px;border:3px solid #000;border-radius:8px;background:#f5f5f5;
    box-shadow:2px 2px 0 #000;}
  .sum-label{font-family:'Press Start 2P',monospace;font-size:.45em;color:#666;margin-bottom:6px;display:block;}
  .sum-value{font-family:'Press Start 2P',monospace;font-size:.9em;font-weight:900;color:var(--dark);}
  .sum-box.highlight{background:linear-gradient(135deg,#ffb347,#ff8c00);color:#fff;}
  .sum-box.highlight .sum-label,.sum-box.highlight .sum-value{color:#fff;}
  .switch{display:flex;gap:6px;margin-bottom:12px;}
  .switch button{flex:1;padding:10px;border:3px solid #000;border-radius:8px;background:#fff;
    font-weight:800;font-size:.85em;box-shadow:2px 2px 0 #000;cursor:pointer;touch-action:manipulation;min-height:44px;}
  .switch button.active{background:var(--dark);color:#fff;}
  /* Member table (scrollable + sortable) */
  .lb-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:3px solid #000;border-radius:8px;background:#fff;margin-top:10px;}
  table.lb{width:100%;border-collapse:collapse;font-size:.78em;background:#fff;min-width:640px;}
  table.lb th,table.lb td{padding:7px 8px;text-align:left;border-bottom:2px solid #eee;white-space:nowrap;}
  table.lb th{background:var(--dark);color:#fff;font-weight:800;font-size:.85em;}
  table.lb tbody tr.me{background:linear-gradient(90deg,#fff3cd,#ffe0b2);font-weight:800;}
  table.lb tbody tr:last-child td{border-bottom:none;}
  th.sortable{cursor:pointer;-webkit-user-select:none;user-select:none;}
  th.sortable .ar{opacity:.8;font-size:.85em;margin-left:2px;}
  th.active-sort{background:var(--orange);}
  .rank-badge{display:inline-block;min-width:26px;padding:2px 6px;border-radius:6px;background:var(--orange);color:#fff;
    font-weight:900;text-align:center;font-size:.82em;}
  .rank-badge.gold{background:#f9a825;} .rank-badge.silver{background:#9e9e9e;} .rank-badge.bronze{background:#a1887f;}
  #snakeOverlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;flex-direction:column;
    justify-content:center;align-items:center;z-index:200;padding:10px;touch-action:none;}
  #snakeOverlay.show{display:flex;}
  #snakeCanvas{background:#111;border:4px solid var(--orange);max-width:92vw;max-height:60vh;touch-action:none;}
  .game-label{color:#fff;font-family:'Courier New',monospace;margin-bottom:6px;font-size:.95em;text-align:center;}
  .game-score{color:var(--orange);font-family:'Courier New',monospace;font-size:1.2em;font-weight:900;margin-bottom:4px;}
  .game-hint{color:#aaa;font-size:.78em;margin-top:8px;text-align:center;}
  @media(max-width:600px){
    .brand-title{font-size:.68em;} .logo{height:36px;}
    .container{padding:10px;} .card{padding:12px;}
    .grid2{grid-template-columns:1fr;}
    .team-dp{width:48px;height:48px;}
    .summary-grid{grid-template-columns:repeat(2,1fr);}
    table.lb{font-size:.72em;min-width:600px;}
    table.lb th,table.lb td{padding:6px 6px;}
    .user-info span{max-width:80px;}
  }
  @media(max-width:380px){ .brand-title{display:none;} }
</style>
</head>
<body>

<div id="sky"></div>
<div id="clouds"></div>
<div id="ground"></div>

<header>
  <div class="brand-wrap">
    <img src="./LOGO.png" alt="ACI" class="logo" onerror="this.style.display='none'">
    <span class="brand-title">ACI CareerEDGE<br>Campus Leadership Programme</span>
  </div>
  <div class="user-info">
    <a href="index.html">←</a>
    <span id="syncDot" class="syncing" style="display:none;"></span>
    <span id="headerName"></span>
    <button class="btn btn-warn" style="padding:6px 10px;min-height:0;font-size:.78em;" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">
  <div class="banner">
    <img id="teamDP" class="team-dp" alt="">
    <div style="min-width:0;">
      <h2 id="teamTitle">Team</h2>
      <div class="sub" id="teamSub"></div>
    </div>
  </div>

  <div class="card">
    <h3 id="formTitle">📝 Work Submission</h3>
    <label>📅 Date</label>
    <input type="date" id="eDate">
    <div class="grid2">
      <div><label>Attendance</label>
        <select id="eAttendance">
          <option value="Present">Present</option>
          <option value="Absent">Absent</option>
        </select></div>
      <div><label>Working Minutes</label>
        <input type="text" id="eMinutes" inputmode="numeric" pattern="[0-9]*" value="0" maxlength="5"
               autocomplete="off" autocorrect="off" spellcheck="false"></div>
      <div><label>Promotional Posts</label>
        <input type="text" id="ePromos" inputmode="numeric" pattern="[0-9]*" value="0" maxlength="5"
               autocomplete="off" autocorrect="off" spellcheck="false"></div>
    </div>
    <label>Remarks (optional)</label>
    <textarea id="eRemarks" rows="2" maxlength="500" placeholder="Anything worth noting?"></textarea>
    <p class="note">Successful Applications &amp; Registrations are recorded by the admin.</p>
    <button class="btn btn-primary" style="width:100%;" id="submitBtn" onclick="submitEntry(this)">🚀 Submit</button>
    <p id="formMsg" style="margin-top:8px;font-weight:700;"></p>
  </div>

  <div class="card">
    <div class="switch">
      <button id="tabFeed" class="active" onclick="switchView('feed', this)">👥 Team Feed</button>
      <button id="tabSummary" onclick="switchView('summary', this)">📊 Team Summary</button>
    </div>
    <div id="view-feed">
      <p style="font-size:.82em;color:#555;margin-bottom:10px;">Today &amp; yesterday — only your team can see this.</p>
      <div id="feedBox"></div>
    </div>
    <div id="view-summary" style="display:none;">
      <div class="summary-grid">
        <div class="sum-box"><span class="sum-label">MINUTES</span><div class="sum-value" id="tsMin">0</div></div>
        <div class="sum-box"><span class="sum-label">PROMOS</span><div class="sum-value" id="tsPromo">0</div></div>
        <div class="sum-box"><span class="sum-label">APPS</span><div class="sum-value" id="tsApps">0</div></div>
        <div class="sum-box"><span class="sum-label">REGS</span><div class="sum-value" id="tsRegs">0</div></div>
      </div>
      <div id="membersBox"></div>
    </div>
  </div>
</div>

<div id="snakeOverlay">
  <div class="game-label">🎓 Loading…</div>
  <div class="game-score">Score: <span id="snakeScore">0</span></div>
  <canvas id="snakeCanvas" width="320" height="320"></canvas>
  <div class="game-hint">Tap arrows or swipe to play</div>
</div>

<script>
/* ---------- SERVICE WORKER ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

(function lockDown(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); }, {capture:true});
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toUpperCase();
    if (k === 'F12') { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && ['I','J','C','K','M'].indexOf(k) !== -1) { e.preventDefault(); return false; }
    if (e.ctrlKey && ['U','S','P'].indexOf(k) !== -1) { e.preventDefault(); return false; }
  }, {capture:true});
  document.addEventListener('dragstart', function(e){ e.preventDefault(); }, {capture:true});
})();

var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if (!isMobile){
  window.addEventListener('scroll', function(){
    var y = window.pageYOffset;
    var s = document.getElementById('sky'); var c = document.getElementById('clouds');
    if (s) s.style.transform = 'translateY(' + (y * 0.35) + 'px)';
    if (c) c.style.transform = 'translateY(' + (y * 0.6) + 'px)';
  }, {passive:true});
}

var API_URL = 'https://script.google.com/macros/s/AKfycbyp-3MaW7JqdPgNN0lDw3RnAotlFIcK3vQDNfADIdVcNiMVshaFGZKhZqmGKNcGKYYA/exec';
var $ = function(id){ return document.getElementById(id); };
var user = null;

/* ---------- LOCALSTORAGE CACHE ---------- */
var CACHE_TTL = { entry: 60*60*1000, feed: 2*60*1000, sum: 3*60*1000 };
function readCache(key){
  try {
    var raw = localStorage.getItem(key);
    if (!raw) return null;
    var obj = JSON.parse(raw);
    if (obj.exp && obj.exp < Date.now()){ localStorage.removeItem(key); return null; }
    return obj.data;
  } catch(e){ return null; }
}
function writeCache(key, data, ttlMs){
  try { localStorage.setItem(key, JSON.stringify({ data: data, exp: Date.now() + (ttlMs || CACHE_TTL.entry) })); } catch(e){}
}
function clearUserCache(){
  try {
    var keys = [];
    for (var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if (k && k.indexOf('aci_') === 0 && k.indexOf('aci_prefs_') !== 0) keys.push(k);
    }
    keys.forEach(function(k){ localStorage.removeItem(k); });
  } catch(e){}
}
function showSync(on){ var d = $('syncDot'); if (d) d.style.display = on ? 'inline-block' : 'none'; }

/* ---------- USER PREFS ---------- */
function loadPrefs(code){
  try { return JSON.parse(localStorage.getItem('aci_prefs_' + code) || '{}'); }
  catch(e){ return {}; }
}
function savePrefs(code, obj){
  try { localStorage.setItem('aci_prefs_' + code, JSON.stringify(obj)); } catch(e){}
}

/* ---------- SNAKE ---------- */
var snakeGameId = 0;
function showSnake(){ snakeGameId++; var id = snakeGameId; $('snakeOverlay').classList.add('show'); startSnake(id); }
function hideSnake(){ snakeGameId++; $('snakeOverlay').classList.remove('show'); }
function startSnake(myId){
  var oldCanvas = $('snakeCanvas');
  var canvas = oldCanvas.cloneNode(true);
  oldCanvas.parentNode.replaceChild(canvas, oldCanvas);
  var ctx = canvas.getContext('2d');
  var GRID = 16, SIZE = canvas.width / GRID;
  var codes = ['1','2','3','4','5','6','7','8'];
  var imgs = codes.map(function(c){ var i = new Image(); i.src = './' + c + '.png'; return i; });
  var state = { snake: [{x:8,y:8},{x:7,y:8},{x:6,y:8}], dir: {x:1,y:0},
                food: {x:12,y:8,idx:0}, score: 0, over: false };
  function placeFood(){
    var attempts = 0;
    do {
      state.food.x = Math.floor(Math.random() * GRID);
      state.food.y = Math.floor(Math.random() * GRID);
      state.food.idx = (state.food.idx + 1) % imgs.length;
      attempts++;
    } while (state.snake.some(function(s){ return s.x === state.food.x && s.y === state.food.y; }) && attempts < 50);
  }
  function draw(){
    ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#1f1f1f';
    for (var i = 0; i <= GRID; i++){
      ctx.beginPath(); ctx.moveTo(i*SIZE, 0); ctx.lineTo(i*SIZE, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*SIZE); ctx.lineTo(canvas.width, i*SIZE); ctx.stroke();
    }
    state.snake.forEach(function(s, i){
      ctx.fillStyle = (i === 0) ? '#ff8c00' : '#2e7d32';
      ctx.fillRect(s.x*SIZE+1, s.y*SIZE+1, SIZE-2, SIZE-2);
      ctx.strokeStyle = '#000';
      ctx.strokeRect(s.x*SIZE+1, s.y*SIZE+1, SIZE-2, SIZE-2);
    });
    var img = imgs[state.food.idx];
    if (img.complete && img.naturalWidth) ctx.drawImage(img, state.food.x*SIZE, state.food.y*SIZE, SIZE, SIZE);
    else { ctx.fillStyle = '#ff8c00'; ctx.fillRect(state.food.x*SIZE, state.food.y*SIZE, SIZE, SIZE); }
    $('snakeScore').textContent = state.score;
  }
  function step(){
    if (myId !== snakeGameId) return;
    if (state.over) return;
    var head = { x: state.snake[0].x + state.dir.x, y: state.snake[0].y + state.dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        state.snake.some(function(s){ return s.x === head.x && s.y === head.y; })){
      state.over = true;
      setTimeout(function(){
        if (myId !== snakeGameId) return;
        state.snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
        state.dir = {x:1,y:0}; state.score = 0; state.over = false;
        placeFood();
      }, 700);
      return;
    }
    state.snake.unshift(head);
    if (head.x === state.food.x && head.y === state.food.y){ state.score++; placeFood(); }
    else state.snake.pop();
    draw();
  }
  var keyHandler = function(e){
    if (myId !== snakeGameId) return;
    var k = e.key;
    if (k === 'ArrowUp'    && state.dir.y === 0) state.dir = {x:0,y:-1};
    if (k === 'ArrowDown'  && state.dir.y === 0) state.dir = {x:0,y:1};
    if (k === 'ArrowLeft'  && state.dir.x === 0) state.dir = {x:-1,y:0};
    if (k === 'ArrowRight' && state.dir.x === 0) state.dir = {x:1,y:0};
    if (k.indexOf('Arrow') === 0) e.preventDefault();
  };
  document.addEventListener('keydown', keyHandler);
  var tsX = 0, tsY = 0;
  canvas.addEventListener('touchstart', function(e){ tsX = e.touches[0].clientX; tsY = e.touches[0].clientY; }, {passive:true});
  canvas.addEventListener('touchend', function(e){
    if (myId !== snakeGameId) return;
    var dx = e.changedTouches[0].clientX - tsX, dy = e.changedTouches[0].clientY - tsY;
    if (Math.abs(dx) > Math.abs(dy)){
      if (dx > 0 && state.dir.x === 0) state.dir = {x:1,y:0};
      else if (dx < 0 && state.dir.x === 0) state.dir = {x:-1,y:0};
    } else {
      if (dy > 0 && state.dir.y === 0) state.dir = {x:0,y:1};
      else if (dy < 0 && state.dir.y === 0) state.dir = {x:0,y:-1};
    }
  }, {passive:true});
  var tick = setInterval(function(){
    if (myId !== snakeGameId){ clearInterval(tick); document.removeEventListener('keydown', keyHandler); return; }
    step();
  }, 160);
  placeFood(); draw();
}

/* ---------- API ---------- */
function api(action, payload){
  payload = payload || {};
  var body = JSON.stringify(Object.assign({action: action}, payload));
  return fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: body, redirect: 'follow', cache: 'no-store'
  }).then(function(res){
    return res.text().then(function(text){
      if (!text) throw new Error('Empty response.');
      try { return JSON.parse(text); }
      catch (je){
        if (text.indexOf('<html') >= 0 || text.indexOf('<!DOCTYPE') >= 0)
          throw new Error('Deployment access must be set to "Anyone".');
        throw new Error('Unexpected server response.');
      }
    });
  });
}
function esc(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad(n){ return String(n).padStart(2, '0'); }
function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function yesterdayStr(){ var d = new Date(); d.setDate(d.getDate() - 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function debounce(fn, ms){
  var t;
  return function(){
    var a = arguments, c = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(c, a); }, ms);
  };
}
var snakeShown = false;
function withSnake(fn, silent){
  var timer = null;
  if (!silent){
    timer = setTimeout(function(){
      if (!snakeShown){ snakeShown = true; showSnake(); }
    }, 450);
  }
  return Promise.resolve().then(fn).finally(function(){
    if (timer) clearTimeout(timer);
    if (snakeShown){
      snakeShown = false;
      setTimeout(hideSnake, 180);
    }
  });
}
function logout(){
  clearUserCache();
  localStorage.removeItem('aci_user');
  sessionStorage.clear();
  location.href = 'index.html';
}

function digitsOnly(el){
  el.addEventListener('input', function(){
    var v = this.value.replace(/[^0-9]/g, '');
    if (v !== this.value) this.value = v;
  });
  el.addEventListener('keypress', function(e){
    if (e.key.length === 1 && !/[0-9]/.test(e.key)) e.preventDefault();
  });
  el.addEventListener('paste', function(e){
    e.preventDefault();
    var txt = (e.clipboardData || window.clipboardData).getData('text');
    var clean = String(txt).replace(/[^0-9]/g, '');
    var start = this.selectionStart, end = this.selectionEnd;
    var cur = this.value;
    this.value = cur.slice(0, start) + clean + cur.slice(end);
  });
  el.addEventListener('drop', function(e){ e.preventDefault(); });
}

/* ---------- BOOT ---------- */
window.addEventListener('load', function(){
  var saved = sessionStorage.getItem('aci_team_user') || localStorage.getItem('aci_user');
  if (!saved){ location.href = 'index.html'; return; }
  try { user = JSON.parse(saved); }
  catch (e){ location.href = 'index.html'; return; }

  if (!user.teamNumber || user.teamNumber === 0){ location.href = 'index.html'; return; }

  var t = Number(new URLSearchParams(location.search).get('t'));
  if (t && t !== user.teamNumber){ location.replace('team.html?t=' + user.teamNumber); return; }

  $('headerName').textContent = user.name + ' (' + user.code + ')';
  $('teamTitle').textContent  = user.teamName;
  $('teamSub').textContent    = 'Team ' + user.teamNumber + ' · ' + user.code;

  var dp = $('teamDP');
  dp.src = './' + user.teamNumber + '.png';
  dp.onerror = function(){ this.style.visibility = 'hidden'; };

  var di = $('eDate');
  di.min = yesterdayStr();
  di.max = todayStr();
  di.value = todayStr();
  di.addEventListener('change', debounce(loadMyEntry, 200));

  digitsOnly($('eMinutes'));
  digitsOnly($('ePromos'));

  /* Restore view preference */
  var prefs = loadPrefs(user.code);
  if (prefs.view === 'summary'){
    var sumBtn = $('tabSummary');
    if (sumBtn) switchView('summary', sumBtn);
  }

  loadMyEntry();
  loadTeamPosts();
  loadTeamSummary();
}, {once:true});

function switchView(name, btn){
  var btns = document.querySelectorAll('.switch button');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  btn.classList.add('active');
  $('view-feed').style.display = (name === 'feed') ? 'block' : 'none';
  $('view-summary').style.display = (name === 'summary') ? 'block' : 'none';
  if (user){
    var p = loadPrefs(user.code);
    p.view = name;
    savePrefs(user.code, p);
  }
  if (name === 'summary') loadTeamSummary();
}

function loadMyEntry(){
  var date = $('eDate').value;
  if (!date) return;
  $('formMsg').textContent = '';
  var cacheKey = 'aci_entry_' + user.code + '_' + date;
  var cached = readCache(cacheKey);

  function apply(entry){
    if (entry){
      $('formTitle').textContent = '✏️ Edit Work Submission — ' + date;
      $('submitBtn').textContent = '💾 Update Entry';
      $('eAttendance').value = entry.attendance || 'Present';
      $('eMinutes').value = entry.minutes;
      $('ePromos').value  = entry.promos;
      $('eRemarks').value = entry.remarks || '';
    } else {
      $('formTitle').textContent = '📝 Work Submission';
      $('submitBtn').textContent = '🚀 Submit';
      $('eAttendance').value = 'Present';
      $('eMinutes').value = 0;
      $('ePromos').value = 0;
      $('eRemarks').value = '';
    }
  }
  if (cached !== null) apply(cached.entry || null);
  var silent = cached !== null;
  if (silent) showSync(true);
  withSnake(function(){ return api('getMyEntry', {code: user.code, date: date}); }, silent)
    .then(function(r){
      var e = r.entry || null;
      writeCache(cacheKey, {entry: e}, CACHE_TTL.entry);
      apply(e);
    })
    .catch(function(){})
    .finally(function(){ showSync(false); });
}

function submitEntry(btn){
  var date = $('eDate').value;
  if (!date){ $('formMsg').textContent = 'Please pick a date.'; return; }
  var mins = String($('eMinutes').value).replace(/\D/g, '') || '0';
  var promos = String($('ePromos').value).replace(/\D/g, '') || '0';
  var o = btn.textContent;
  btn.disabled = true; btn.textContent = 'Saving…';
  $('formMsg').textContent = '';
  withSnake(function(){
    return api('submitEntry', {
      code: user.code, date: date,
      attendance: $('eAttendance').value,
      minutes: Number(mins) || 0,
      promos:  Number(promos) || 0,
      remarks: $('eRemarks').value
    });
  })
    .then(function(r){
      if (!r.success){
        $('formMsg').textContent = r.message || 'Failed.';
        $('formMsg').className = 'err';
        return;
      }
      $('formMsg').textContent = r.updated ? '✅ Entry updated!' : '✅ Entry saved!';
      $('formMsg').className = 'ok';
      try {
        localStorage.removeItem('aci_entry_' + user.code + '_' + date);
        localStorage.removeItem('aci_boot_' + user.code);
        localStorage.removeItem('aci_feed_' + user.teamNumber);
        localStorage.removeItem('aci_sum_' + user.teamNumber);
        var keysToNuke = [];
        for (var i = 0; i < localStorage.length; i++){
          var k = localStorage.key(i);
          if (k && k.indexOf('aci_lb_' + user.code + '_') === 0) keysToNuke.push(k);
        }
        keysToNuke.forEach(function(k){ localStorage.removeItem(k); });
      } catch(e){}
      return Promise.all([loadMyEntry(), loadTeamPosts(true), loadTeamSummary(true)]);
    })
    .catch(function(e){
      $('formMsg').textContent = e.message || 'Failed. Try again.';
      $('formMsg').className = 'err';
    })
    .finally(function(){ btn.disabled = false; btn.textContent = o; });
}

function loadTeamPosts(force){
  var cacheKey = 'aci_feed_' + user.teamNumber;
  var cached = readCache(cacheKey);
  if (cached && !force){
    renderFeed(cached);
  } else if (!cached){
    $('feedBox').innerHTML = '<p class="empty">Loading…</p>';
  }
  var silent = !!cached && !force;
  if (silent) showSync(true);
  withSnake(function(){ return api('getTeamPosts', {teamNumber: user.teamNumber}); }, silent)
    .then(function(r){
      var posts = r.posts || [];
      writeCache(cacheKey, posts, CACHE_TTL.feed);
      renderFeed(posts);
    })
    .catch(function(){ if (!cached) $('feedBox').innerHTML = '<p class="err">Failed to load feed.</p>'; })
    .finally(function(){ showSync(false); });
}

function renderFeed(posts){
  if (!posts || !posts.length){
    $('feedBox').innerHTML = '<p class="empty">No entries from your team for today or yesterday yet.</p>';
    return;
  }
  var p = [];
  for (var i = 0; i < posts.length; i++){
    var x = posts[i];
    var mine = x.code === user.code ? ' mine' : '';
    var attCls = x.attendance === 'Absent' ? 'absent' : 'present';
    var dt = new Date(x.updatedAt).toLocaleString();
    p.push(
      '<div class="post' + mine + '">' +
        '<div class="post-head">' +
          '<div><span class="post-name">' + esc(x.name) + '</span> ' +
          '<span style="color:#666;font-size:.82em;">(' + esc(x.code) + ')</span></div>' +
          '<div class="post-date">' + esc(x.date) + '</div>' +
        '</div>' +
        '<div>' +
          '<span class="pill ' + attCls + '">' + esc(x.attendance) + '</span>' +
          '<span class="pill">⏱ ' + x.minutes + 'm</span>' +
          '<span class="pill">📢 ' + x.promos + '</span>' +
          '<span class="pill readonly">📝 ' + x.apps + '</span>' +
          '<span class="pill readonly">✅ ' + x.regs + '</span>' +
        '</div>' +
        (x.remarks ? '<div style="margin-top:6px;font-style:italic;color:#333;">"' + esc(x.remarks) + '"</div>' : '') +
      '</div>'
    );
  }
  $('feedBox').innerHTML = p.join('');
}

/* ---------- TEAM SUMMARY (member breakdown + overall rank + sorting) ---------- */
var summarySort = {key: 'month', dir: -1};
var summaryBadge = function(r){ return r <= 3 ? 'gold silver bronze'.split(' ')[r-1] : ''; };
function summaryArrow(s, k){
  if (s.key !== k) return '<span class="ar">↕</span>';
  return '<span class="ar">' + (s.dir < 0 ? '▼' : '▲') + '</span>';
}
var SUMMARY_COLS = [
  {k:'overallRank', l:'Overall'},
  {k:'minutes',     l:'Min'},
  {k:'promos',      l:'Promo'},
  {k:'apps',        l:'App'},
  {k:'regs',        l:'Reg'},
  {k:'present',     l:'Att (P/A)'},
  {k:'month',       l:'Month'},
  {k:'total',       l:'All'}
];

function loadTeamSummary(force){
  var cacheKey = 'aci_sum_' + user.teamNumber;
  var cached = readCache(cacheKey);
  if (cached && !force){
    renderSummary(cached);
  } else if (!cached){
    $('membersBox').innerHTML = '<p class="empty">Loading…</p>';
  }
  var silent = !!cached && !force;
  if (silent) showSync(true);
  withSnake(function(){ return api('getTeamSummary', {teamNumber: user.teamNumber}); }, silent)
    .then(function(r){
      if (!r.success) return;
      writeCache(cacheKey, r, CACHE_TTL.sum);
      renderSummary(r);
    })
    .catch(function(){ if (!cached) $('membersBox').innerHTML = '<p class="err">Failed to load summary.</p>'; })
    .finally(function(){ showSync(false); });
}

function renderSummary(r){
  window.__lastSummary = r;

  var t = r.totals;
  $('tsMin').textContent   = t.minutes;
  $('tsPromo').textContent = t.promos;
  $('tsApps').textContent  = t.apps;
  $('tsRegs').textContent  = t.regs;

  var members = r.members || [];
  if (!members.length){
    $('membersBox').innerHTML = '<p class="empty">No members on this team yet.</p>';
    return;
  }

  var s = summarySort;
  var rows = members.slice().sort(function(a, b){
    var av = Number(a[s.key]) || 0, bv = Number(b[s.key]) || 0;
    if (s.key === 'overallRank'){
      if (av === 0 && bv !== 0) return 1;
      if (bv === 0 && av !== 0) return -1;
    }
    if (av !== bv) return (av - bv) * s.dir;
    if ((b.month || 0) !== (a.month || 0)) return (b.month || 0) - (a.month || 0);
    return (b.total || 0) - (a.total || 0);
  });

  var p = ['<h4 style="margin-top:10px;">🏅 Member Rankings</h4>'];
  p.push('<div class="lb-scroll"><table class="lb"><thead><tr>');
  p.push('<th title="Rank within this team (this month)">#</th>');
  p.push('<th>Name</th>');
  for (var c = 0; c < SUMMARY_COLS.length; c++){
    var col = SUMMARY_COLS[c];
    var title = col.k === 'overallRank'
      ? 'Overall individual rank this month'
      : (col.k === 'present' ? 'Days Present / Absent'
      : (col.k === 'month' ? 'Points this month' : (col.k === 'total' ? 'Points all time' : col.l)));
    p.push('<th class="sortable' + (s.key === col.k ? ' active-sort' : '') +
           '" data-k="' + col.k + '" title="' + title + '">' +
           col.l + summaryArrow(s, col.k) + '</th>');
  }
  p.push('</tr></thead><tbody>');

  for (var i = 0; i < rows.length; i++){
    var m = rows[i];
    var me = m.code === user.code ? ' class="me"' : '';
    p.push('<tr' + me + '>' +
      '<td><span class="rank-badge ' + summaryBadge(m.rank) + '">' + m.rank + '</span></td>' +
      '<td>' + esc(m.name) + '<div style="font-size:.7em;color:#666;">' + esc(m.code) + '</div></td>' +
      '<td>' + (m.overallRank ? '#' + m.overallRank : '—') + '</td>' +
      '<td>' + (m.minutes || 0) + '</td>' +
      '<td>' + (m.promos  || 0) + '</td>' +
      '<td>' + (m.apps    || 0) + '</td>' +
      '<td>' + (m.regs    || 0) + '</td>' +
      '<td>' + (m.present || 0) + ' / ' + (m.absent || 0) + '</td>' +
      '<td><strong>' + (m.month || 0) + '</strong></td>' +
      '<td>' + (m.total || 0) + '</td>' +
    '</tr>');
  }
  p.push('</tbody></table></div>');
  $('membersBox').innerHTML = p.join('');
}

document.addEventListener('click', function(e){
  var el = e.target;
  while (el && el !== document){
    if (el.tagName === 'TH' && el.classList && el.classList.contains('sortable')){
      var k = el.getAttribute('data-k');
      if (summarySort.key === k) summarySort.dir = -summarySort.dir;
      else { summarySort.key = k; summarySort.dir = -1; }
      if (window.__lastSummary) renderSummary(window.__lastSummary);
      if (user){
        var p = loadPrefs(user.code);
        p.summarySort = summarySort;
        savePrefs(user.code, p);
      }
      return;
    }
    el = el.parentNode;
  }
});

/* Restore summary sort pref */
(function restoreSummarySort(){
  var saved = sessionStorage.getItem('aci_team_user') || localStorage.getItem('aci_user');
  if (!saved) return;
  try {
    var u = JSON.parse(saved);
    var p = loadPrefs(u.code);
    if (p.summarySort) summarySort = p.summarySort;
  } catch(e){}
})();
</script>
