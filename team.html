<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Team Dashboard — ACI Careeredge Campus Lead</title>
<link rel="icon" href="./favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="preload" as="image" href="./LOGO.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1bddff;--ground:#2e7d32;--card:rgba(255,255,255,.94);--orange:#ff8c00;--text:#1a1a1a;--dark:#0d2b3e;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;user-select:none;-webkit-user-select:none;}
  input,textarea,select{user-select:text;-webkit-user-select:text;}
  img{-webkit-user-drag:none;pointer-events:none;}

  #sky{position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(circle at 20% 20%, #fff6 0 4px, transparent 5px),
      radial-gradient(circle at 70% 40%, #fff6 0 6px, transparent 7px),
      radial-gradient(circle at 40% 70%, #fff4 0 3px, transparent 4px),
      radial-gradient(circle at 85% 15%, #fff5 0 5px, transparent 6px),
      linear-gradient(180deg, #1bddff 0%, #45e3ff 60%, #a8f0ff 100%);
    background-size:200px 200px,300px 300px,150px 150px,250px 250px,100% 100%;
    will-change:transform;}
  #clouds{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      radial-gradient(ellipse 80px 30px at 15% 15%, #fff, transparent 70%),
      radial-gradient(ellipse 100px 35px at 60% 25%, #fff, transparent 70%),
      radial-gradient(ellipse 70px 25px at 35% 45%, #fff, transparent 70%);
    opacity:.55;will-change:transform;}
  #ground{position:fixed;bottom:0;left:0;width:100%;height:120px;z-index:-1;background:var(--ground);
    box-shadow:inset 0 6px 0 #1b5e20,inset 0 -10px 0 #1b3d12;
    background-image:repeating-linear-gradient(90deg,#2e7d32 0 40px,#276b2b 40px 80px);}

  header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;
    background:rgba(0,0,0,.35);backdrop-filter:blur(6px);border-bottom:4px solid #000;
    position:sticky;top:0;z-index:50;}
  .brand-wrap{display:flex;align-items:center;gap:12px;}
  .logo{height:46px;image-rendering:pixelated;}
  .brand-title{font-family:'Press Start 2P',monospace;font-size:.9em;color:#fff;
    text-shadow:2px 2px 0 #000,4px 4px 0 #ff8c00;letter-spacing:1px;line-height:1.3;
    -webkit-font-smoothing:none;}
  .user-info{display:flex;align-items:center;gap:12px;color:#fff;font-weight:700;font-size:.9em;}

  .container{max-width:820px;margin:0 auto;padding:18px;}
  .card{background:var(--card);border:4px solid #000;border-radius:12px;padding:18px;margin-bottom:16px;
    box-shadow:6px 6px 0 rgba(0,0,0,.35);}
  .card h2,.card h3{margin-bottom:10px;}
  input,textarea,select{width:100%;padding:10px 12px;margin-bottom:10px;border:3px solid #000;border-radius:8px;font-size:1em;background:#fff;}
  label{font-weight:600;display:block;margin-bottom:4px;font-size:.9em;}
  .btn{padding:10px 18px;border:3px solid #000;border-radius:8px;cursor:pointer;font-weight:800;font-size:.95em;
    background:#fff;color:#000;box-shadow:3px 3px 0 #000;transition:transform .06s;}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000;}
  .btn:disabled{opacity:.6;cursor:wait;}
  .btn-primary{background:var(--ground);color:#fff;}
  .btn-warn{background:var(--orange);color:#fff;}

  .stats-card{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
    background:var(--card);border:4px solid #000;border-radius:12px;padding:16px;margin-bottom:16px;
    box-shadow:6px 6px 0 rgba(0,0,0,.35);}
  .stat-box{text-align:center;padding:10px 6px;border:3px solid #000;border-radius:8px;
    background:#e0f7fa;box-shadow:3px 3px 0 #000;}
  .stat-box.total{background:linear-gradient(135deg,#ffb347,#ff8c00);color:#fff;text-shadow:1px 1px 0 #000;}
  .stat-box.team{background:linear-gradient(135deg,#5c6bc0,#3949ab);color:#fff;text-shadow:1px 1px 0 #000;}
  .stat-label{font-family:'Press Start 2P',monospace;font-size:.55em;margin-bottom:8px;display:block;color:#333;}
  .stat-box.total .stat-label,.stat-box.team .stat-label{color:#fff;}
  .stat-value{font-family:'Press Start 2P',monospace;font-size:1.1em;font-weight:900;color:#0d2b3e;}
  .stat-box.total .stat-value,.stat-box.team .stat-value{color:#fff;}

  .pill{display:inline-block;padding:3px 9px;border-radius:12px;background:#e0f7fa;border:2px solid #000;
    font-size:.78em;font-weight:700;margin:2px 4px 2px 0;}
  .pill.absent{background:#ffcdd2;}
  .pill.present{background:#c8e6c9;}
  .pill.readonly{background:#f5f5f5;color:#666;border-style:dashed;}
  .post{border:3px solid #000;border-radius:10px;padding:12px;margin-bottom:10px;background:#fff;
    box-shadow:3px 3px 0 rgba(0,0,0,.25);content-visibility:auto;contain-intrinsic-size:100px;}
  .post.mine{background:linear-gradient(135deg,#fff3cd,#ffe0b2);}
  .post-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap;gap:6px;}
  .post-name{font-weight:800;}
  .post-date{font-size:.78em;color:#555;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .empty{color:#666;font-style:italic;font-size:.9em;}
  .err{color:#c00;font-weight:700;}
  .ok{color:#2e7d32;font-weight:700;}
  .banner{background:linear-gradient(135deg,#ffb347,#ff8c00);color:#fff;text-shadow:1px 1px 0 #000;
    padding:14px 18px;border:4px solid #000;border-radius:12px;box-shadow:6px 6px 0 rgba(0,0,0,.35);margin-bottom:16px;
    display:flex;align-items:center;gap:14px;}
  .team-dp{width:64px;height:64px;border:3px solid #000;border-radius:10px;image-rendering:pixelated;background:#fff;}
  .banner h2{font-size:1.1em;}
  .banner .sub{font-size:.85em;opacity:.95;}
  .note{font-size:.8em;color:#555;font-style:italic;margin:-4px 0 8px;}

  #snakeOverlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;
    justify-content:center;align-items:center;z-index:200;padding:10px;}
  #snakeOverlay.show{display:flex;}
  #snakeCanvas{background:#111;border:4px solid var(--orange);max-width:90vw;max-height:60vh;touch-action:none;}
  .game-label{color:#fff;font-family:'Courier New',monospace;margin-bottom:8px;font-size:1em;text-align:center;}
  .game-score{color:var(--orange);font-family:'Courier New',monospace;font-size:1.3em;font-weight:900;margin-bottom:6px;}
  .game-hint{color:#aaa;font-size:.82em;margin-top:10px;text-align:center;}

  @media(max-width:600px){
    .brand-title{font-size:.7em;} .logo{height:38px;}
    .container{padding:12px;} .grid2{grid-template-columns:1fr;}
    .stats-card{grid-template-columns:repeat(2,1fr);padding:12px;gap:8px;}
    .stat-value{font-size:.95em;} .stat-label{font-size:.5em;}
  }
</style>
</head>
<body>

<div id="sky"></div>
<div id="clouds"></div>
<div id="ground"></div>

<header>
  <div class="brand-wrap">
    <img src="./LOGO.png" alt="ACI Careeredge Campus Lead" class="logo" onerror="this.style.display='none'">
    <span class="brand-title">ACI Careeredge<br>Campus Lead</span>
  </div>
  <div class="user-info">
    <a href="index.html" style="color:#fff;text-decoration:none;font-weight:800;">← Leaderboard</a>
    <span id="headerName"></span>
    <button class="btn btn-warn" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">
  <div class="banner">
    <img id="teamDP" class="team-dp" alt="">
    <div>
      <h2 id="teamTitle">Team</h2>
      <div class="sub" id="teamSub"></div>
    </div>
  </div>

  <div class="stats-card">
    <div class="stat-box"><span class="stat-label">TODAY</span><div class="stat-value" id="statDay">0</div></div>
    <div class="stat-box"><span class="stat-label">WEEK</span><div class="stat-value" id="statWeek">0</div></div>
    <div class="stat-box"><span class="stat-label">MONTH</span><div class="stat-value" id="statMonth">0</div></div>
    <div class="stat-box total"><span class="stat-label">YOU</span><div class="stat-value" id="statTotal">0</div></div>
    <div class="stat-box team"><span class="stat-label">TEAM</span><div class="stat-value" id="statTeam">0</div></div>
  </div>

  <div class="card">
    <h3 id="formTitle">📝 Submit Your Work</h3>
    <label>📅 Date</label>
    <input type="date" id="eDate">
    <div class="grid2">
      <div><label>Attendance</label>
        <select id="eAttendance">
          <option value="Present">Present</option>
          <option value="Absent">Absent</option>
        </select></div>
      <div><label>Working Minutes</label><input type="number" id="eMinutes" value="0" min="0" max="10000"></div>
      <div><label>Promotional Posts</label><input type="number" id="ePromos" value="0" min="0" max="10000"></div>
    </div>
    <label>Remarks (optional)</label>
    <textarea id="eRemarks" rows="2" maxlength="500" placeholder="Anything worth noting?"></textarea>
    <p class="note">Successful Applications &amp; Registrations are recorded by the campus admin.</p>
    <button class="btn btn-primary" style="width:100%;" id="submitBtn" onclick="submitEntry(this)">🚀 Submit</button>
    <p id="formMsg" style="margin-top:8px;font-weight:700;"></p>
  </div>

  <div class="card">
    <h3>👥 Team Feed</h3>
    <p style="font-size:.85em;color:#555;margin-bottom:10px;">Today &amp; yesterday — only your team can see this.</p>
    <div id="feedBox"></div>
  </div>
</div>

<div id="snakeOverlay">
  <div class="game-label">🎓 Loading…</div>
  <div class="game-score">Score: <span id="snakeScore">0</span></div>
  <canvas id="snakeCanvas" width="360" height="360"></canvas>
  <div class="game-hint">Arrow keys (PC) · Swipe (Mobile)</div>
</div>

<script>
(function lockDown(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); }, {capture:true});
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toUpperCase();
    if (k === 'F12') { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && ['I','J','C','K','M'].indexOf(k) !== -1) { e.preventDefault(); return false; }
    if (e.ctrlKey && ['U','S','P'].indexOf(k) !== -1) { e.preventDefault(); return false; }
  }, {capture:true});
  document.addEventListener('dragstart', function(e){ e.preventDefault(); }, {capture:true});
  document.addEventListener('selectstart', function(e){
    var t = e.target.tagName;
    if (t !== 'INPUT' && t !== 'TEXTAREA') e.preventDefault();
  }, {capture:true});
})();

window.addEventListener('scroll', function(){
  var y = window.pageYOffset;
  document.getElementById('sky').style.transform = 'translateY(' + (y * 0.35) + 'px)';
  document.getElementById('clouds').style.transform = 'translateY(' + (y * 0.6) + 'px)';
}, {passive:true});

var API_URL = 'https://script.google.com/macros/s/AKfycbyp-3MaW7JqdPgNN0lDw3RnAotlFIcK3vQDNfADIdVcNiMVshaFGZKhZqmGKNcGKYYA/exec';
var $ = function(id){ return document.getElementById(id); };
var user = null;

/* ---------- SNAKE ---------- */
var snakeGameId = 0;
function showSnake(){
  snakeGameId++;
  var id = snakeGameId;
  $('snakeOverlay').classList.add('show');
  startSnake(id);
}
function hideSnake(){
  snakeGameId++;
  $('snakeOverlay').classList.remove('show');
}
function startSnake(myId){
  var oldCanvas = $('snakeCanvas');
  var canvas = oldCanvas.cloneNode(true);
  oldCanvas.parentNode.replaceChild(canvas, oldCanvas);
  var ctx = canvas.getContext('2d');
  var GRID = 18;
  var SIZE = canvas.width / GRID;
  var codes = ['1','2','3','4','5','6','7','8'];
  var imgs = codes.map(function(c){ var i = new Image(); i.src = './' + c + '.png'; return i; });

  var state = {
    snake: [{x:9,y:9},{x:8,y:9},{x:7,y:9}],
    dir: {x:1,y:0},
    food: {x:13,y:9,idx:0},
    score: 0, over: false
  };
  function placeFood(){
    var attempts = 0;
    do {
      state.food.x = Math.floor(Math.random() * GRID);
      state.food.y = Math.floor(Math.random() * GRID);
      state.food.idx = (state.food.idx + 1) % imgs.length;
      attempts++;
    } while (state.snake.some(function(s){ return s.x === state.food.x && s.y === state.food.y; }) && attempts < 50);
  }
  function draw(){
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#1f1f1f';
    for (var i = 0; i <= GRID; i++){
      ctx.beginPath(); ctx.moveTo(i*SIZE, 0); ctx.lineTo(i*SIZE, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i*SIZE); ctx.lineTo(canvas.width, i*SIZE); ctx.stroke();
    }
    state.snake.forEach(function(s, i){
      ctx.fillStyle = (i === 0) ? '#ff8c00' : '#2e7d32';
      ctx.fillRect(s.x*SIZE+1, s.y*SIZE+1, SIZE-2, SIZE-2);
      ctx.strokeStyle = '#000';
      ctx.strokeRect(s.x*SIZE+1, s.y*SIZE+1, SIZE-2, SIZE-2);
    });
    var img = imgs[state.food.idx];
    if (img.complete && img.naturalWidth){
      ctx.drawImage(img, state.food.x*SIZE, state.food.y*SIZE, SIZE, SIZE);
    } else {
      ctx.fillStyle = '#ff8c00';
      ctx.fillRect(state.food.x*SIZE, state.food.y*SIZE, SIZE, SIZE);
    }
    ctx.strokeStyle = '#ff8c00';
    ctx.strokeRect(state.food.x*SIZE, state.food.y*SIZE, SIZE, SIZE);
    $('snakeScore').textContent = state.score;
  }
  function step(){
    if (myId !== snakeGameId) return;
    if (state.over) return;
    var head = { x: state.snake[0].x + state.dir.x, y: state.snake[0].y + state.dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        state.snake.some(function(s){ return s.x === head.x && s.y === head.y; })){
      state.over = true;
      setTimeout(function(){
        if (myId !== snakeGameId) return;
        state.snake = [{x:9,y:9},{x:8,y:9},{x:7,y:9}];
        state.dir = {x:1,y:0}; state.score = 0; state.over = false;
        placeFood();
      }, 800);
      return;
    }
    state.snake.unshift(head);
    if (head.x === state.food.x && head.y === state.food.y){ state.score++; placeFood(); }
    else state.snake.pop();
    draw();
  }
  var keyHandler = function(e){
    if (myId !== snakeGameId) return;
    var k = e.key;
    if (k === 'ArrowUp'    && state.dir.y === 0) state.dir = {x:0,y:-1};
    if (k === 'ArrowDown'  && state.dir.y === 0) state.dir = {x:0,y:1};
    if (k === 'ArrowLeft'  && state.dir.x === 0) state.dir = {x:-1,y:0};
    if (k === 'ArrowRight' && state.dir.x === 0) state.dir = {x:1,y:0};
    if (k.indexOf('Arrow') === 0) e.preventDefault();
  };
  document.addEventListener('keydown', keyHandler);

  var tsX = 0, tsY = 0;
  canvas.addEventListener('touchstart', function(e){
    tsX = e.touches[0].clientX; tsY = e.touches[0].clientY;
  }, {passive:true});
  canvas.addEventListener('touchend', function(e){
    if (myId !== snakeGameId) return;
    var dx = e.changedTouches[0].clientX - tsX;
    var dy = e.changedTouches[0].clientY - tsY;
    if (Math.abs(dx) > Math.abs(dy)){
      if (dx > 0 && state.dir.x === 0) state.dir = {x:1,y:0};
      else if (dx < 0 && state.dir.x === 0) state.dir = {x:-1,y:0};
    } else {
      if (dy > 0 && state.dir.y === 0) state.dir = {x:0,y:1};
      else if (dy < 0 && state.dir.y === 0) state.dir = {x:0,y:-1};
    }
  }, {passive:true});

  var tick = setInterval(function(){
    if (myId !== snakeGameId){
      clearInterval(tick);
      document.removeEventListener('keydown', keyHandler);
      return;
    }
    step();
  }, 140);

  placeFood();
  draw();
}

/* ---------- API ---------- */
function api(action, payload){
  payload = payload || {};
  var body = JSON.stringify(Object.assign({action: action}, payload));
  return fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain;charset=utf-8'},
    body: body, redirect: 'follow', cache: 'no-store'
  }).then(function(res){
    return res.text().then(function(text){
      if (!text) throw new Error('Empty response from server.');
      try { return JSON.parse(text); }
      catch (je){
        if (text.indexOf('<html') >= 0 || text.indexOf('<!DOCTYPE') >= 0)
          throw new Error('Deployment access must be set to "Anyone".');
        throw new Error('Unexpected server response.');
      }
    });
  });
}
function esc(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function pad(n){ return String(n).padStart(2, '0'); }
function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function yesterdayStr(){ var d = new Date(); d.setDate(d.getDate() - 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function debounce(fn, ms){
  var t;
  return function(){
    var a = arguments, c = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(c, a); }, ms);
  };
}
var snakeShown = false;
function withSnake(fn){
  var timer = setTimeout(function(){
    if (!snakeShown){ snakeShown = true; showSnake(); }
  }, 400);
  return Promise.resolve().then(fn).finally(function(){
    clearTimeout(timer);
    if (snakeShown){
      snakeShown = false;
      setTimeout(hideSnake, 200);
    }
  });
}
function logout(){
  localStorage.removeItem('aci_user');
  sessionStorage.removeItem('aci_team_user');
  location.href = 'index.html';
}

/* ---------- BOOT ---------- */
window.addEventListener('load', function(){
  var saved = sessionStorage.getItem('aci_team_user') || localStorage.getItem('aci_user');
  if (!saved){ location.href = 'index.html'; return; }
  try { user = JSON.parse(saved); }
  catch (e){ location.href = 'index.html'; return; }

  var t = Number(new URLSearchParams(location.search).get('t'));
  if (t && t !== user.teamNumber){ location.replace('team.html?t=' + user.teamNumber); return; }

  $('headerName').textContent = user.name + ' (' + user.code + ')';
  $('teamTitle').textContent  = user.teamName;
  $('teamSub').textContent    = 'Team ' + user.teamNumber + ' · ' + user.code;

  var dp = $('teamDP');
  dp.src = './' + user.teamNumber + '.png';
  dp.onerror = function(){ this.style.visibility = 'hidden'; };

  var di = $('eDate');
  di.min = yesterdayStr();
  di.max = todayStr();
  di.value = todayStr();
  di.addEventListener('change', debounce(loadMyEntry, 200));

  loadStats();
  loadMyEntry();
  loadTeamPosts();
}, {once:true});

function paintStats(s){
  $('statDay').textContent   = s.day;
  $('statWeek').textContent  = s.week;
  $('statMonth').textContent = s.month;
  $('statTotal').textContent = s.total;
  $('statTeam').textContent  = s.teamMonth;
}

function loadStats(){
  withSnake(function(){ return api('getStats', {code: user.code}); })
    .then(function(r){ if (r.success) paintStats(r); })
    .catch(function(){});
}

function loadMyEntry(){
  var date = $('eDate').value;
  if (!date) return;
  $('formMsg').textContent = '';
  withSnake(function(){ return api('getMyEntry', {code: user.code, date: date}); })
    .then(function(r){
      var e = r.entry;
      if (e){
        $('formTitle').textContent = '✏️ Edit Your Entry for ' + date;
        $('submitBtn').textContent = '💾 Update Entry';
        $('eAttendance').value = e.attendance || 'Present';
        $('eMinutes').value = e.minutes;
        $('ePromos').value  = e.promos;
        $('eRemarks').value = e.remarks || '';
      } else {
        $('formTitle').textContent = '📝 Submit Your Work';
        $('submitBtn').textContent = '🚀 Submit';
        $('eAttendance').value = 'Present';
        $('eMinutes').value = 0;
        $('ePromos').value = 0;
        $('eRemarks').value = '';
      }
    })
    .catch(function(){});
}

function submitEntry(btn){
  var date = $('eDate').value;
  if (!date){ $('formMsg').textContent = 'Please pick a date.'; return; }
  var o = btn.textContent;
  btn.disabled = true; btn.textContent = 'Saving…';
  $('formMsg').textContent = '';
  withSnake(function(){
    return api('submitEntry', {
      code: user.code, date: date,
      attendance: $('eAttendance').value,
      minutes: Number($('eMinutes').value) || 0,
      promos:  Number($('ePromos').value)  || 0,
      remarks: $('eRemarks').value
    });
  })
    .then(function(r){
      if (!r.success){
        $('formMsg').textContent = r.message || 'Failed.';
        $('formMsg').className = 'err';
        return;
      }
      $('formMsg').textContent = r.updated ? '✅ Entry updated!' : '✅ Entry saved!';
      $('formMsg').className = 'ok';
      return Promise.all([loadStats(), loadMyEntry(), loadTeamPosts()]);
    })
    .catch(function(e){
      $('formMsg').textContent = e.message || 'Failed. Try again.';
      $('formMsg').className = 'err';
    })
    .finally(function(){
      btn.disabled = false; btn.textContent = o;
    });
}

function loadTeamPosts(){
  if (!$('feedBox').innerHTML) $('feedBox').innerHTML = '<p class="empty">Loading…</p>';
  withSnake(function(){ return api('getTeamPosts', {teamNumber: user.teamNumber}); })
    .then(function(r){
      var posts = r.posts || [];
      if (!posts.length){
        $('feedBox').innerHTML = '<p class="empty">No entries from your team for today or yesterday yet.</p>';
        return;
      }
      var p = [];
      for (var i = 0; i < posts.length; i++){
        var x = posts[i];
        var mine = x.code === user.code ? ' mine' : '';
        var attCls = x.attendance === 'Absent' ? 'absent' : 'present';
        var dt = new Date(x.updatedAt).toLocaleString();
        p.push(
          '<div class="post' + mine + '">' +
            '<div class="post-head">' +
              '<div><span class="post-name">' + esc(x.name) + '</span> ' +
              '<span style="color:#666;font-size:.85em;">(' + esc(x.code) + ')</span></div>' +
              '<div class="post-date">' + esc(x.date) + ' · updated ' + dt + '</div>' +
            '</div>' +
            '<div>' +
              '<span class="pill ' + attCls + '">' + esc(x.attendance) + '</span>' +
              '<span class="pill">⏱ ' + x.minutes + 'm</span>' +
              '<span class="pill">📢 ' + x.promos + '</span>' +
              '<span class="pill readonly">📝 ' + x.apps + '</span>' +
              '<span class="pill readonly">✅ ' + x.regs + '</span>' +
            '</div>' +
            (x.remarks ? '<div style="margin-top:6px;font-style:italic;color:#333;">“' + esc(x.remarks) + '”</div>' : '') +
          '</div>'
        );
      }
      $('feedBox').innerHTML = p.join('');
    })
    .catch(function(){
      $('feedBox').innerHTML = '<p class="err">Failed to load feed.</p>';
    });
}
</script>
</body>
</html>
